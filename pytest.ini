[pytest]
# Put the repo root on sys.path so tests import `academic_defense_simulator.*` the same
# way the scripts do, without installing the package.
pythonpath = .
testpaths = tests
# v2.0 M7 J6: if a test runs past 5 minutes, pytest's built-in faulthandler prints every
# thread's stack (M6 saw one backend run hang for over 30 minutes and couldn't say where).
faulthandler_timeout = 300
