# Render Blueprint for v2.0: the backend and the frontend static site. v1 (Streamlit)
# does not deploy from here. Each service's build filter keeps the other from redeploying it.
services:
  - type: web
    name: ads-backend
    runtime: python
    plan: free
    branch: main
    # Repo root, not backend/: the backend imports v1's academic_defense_simulator modules.
    buildCommand: pip install -r backend/requirements.txt && python -m backend.fetch_model
    # Exactly one worker: each worker would hold its own model copy and its own sessions.
    # --no-proxy-headers: request.client stays the TCP peer; backend/client_ip.py alone
    # reads X-Forwarded-For, trusting only what Cloudflare and Render's proxy appended.
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      # Rebuild on backend changes and on any v1 module the backend imports or will
      # import (rag/, engine, panel and what they pull in, including assets/ for icons).
      paths:
        - backend/**
        - academic_defense_simulator/**
        - render.yaml
      # v1 UI files only, plus the backend's tests.
      ignoredPaths:
        - academic_defense_simulator/streamlit_app.py
        - academic_defense_simulator/panel_selection_ui.py
        - backend/tests/**
        - frontend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Caps glibc malloc arenas; part of the configuration that passed hosting spike 2.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Upload limits (30 MB, 250 pages) are defaults in backend/settings.py, not set here.
      # Browser origins allowed to call the API: the static site's URL (and
      # http://localhost:5173 for local dev), comma-separated. Set in the dashboard once
      # the static site exists and its URL is known.
      - key: ADS_CORS_ORIGINS
        sync: false
      # Panelist voices (POST /tts, M3b). Optional: without it /status reports
      # tts_available false and the frontend offers only the browser voice.
      - key: MIMO_API_KEY
        sync: false

  - type: web
    name: ads-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # Vite 8 needs Node 20.19+; this is the version the build was tested with.
      - key: NODE_VERSION
        value: 24.19.0
      # Baked into the public JavaScript at build time: never a secret.
      - key: VITE_API_BASE_URL
        value: https://ads-backend-bv63.onrender.com
